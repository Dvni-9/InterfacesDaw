<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de producto</title>
  <link rel="stylesheet" href="movil.css" media="(max-width: 599px)">
  <link rel="stylesheet" href="escritorio.css" media="(min-width: 600px)">
</head>
<body>

  <article class="tarjeta">
    <figure class="imagen-box">
      <span class="oferta">OFERTA -20%</span>
      <img src="1677-jbl-tune-720bt-auriculares-inalambricos-bluetooth-plegables-negros.webp">
    </figure>

    <section class="info">
      <p class="categoria">TECNOLOGÍA </p>
      <h1>Auriculares</h1>
      <p class="descripcion">Cancelación de ruido activa, hasta 30 horas de autonomía y transductores de alta fidelidad de 40 mm.</p>

      <section class="precios">
        <del>199,99 €</del>
        <span class="precio-actual">159,99 €</span>
      </section>

      <p class="stock"><span class="punto-verde" aria-hidden="true"></span> En stock</p>

      <button type="button">Añadir al carrito</button>
    </section>
  </article>

</body>
</html>
